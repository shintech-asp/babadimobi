name: pestify_flutter
description: Pestify — pest control service marketplace mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0

  # State management & routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0

  # Auth
  jwt_decoder: ^2.0.1

  # Payments & QR
  webview_flutter: ^4.7.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # UI helpers
  intl: ^0.19.0
  flutter_rating_bar: ^4.0.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
